name: Build managed mpv (manual laboratory)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target (use all only on suitably sized runners)
        required: true
        type: choice
        default: linux-x86_64
        options:
          - linux-x86_64
          - linux-arm64
          - windows-x86_64
          - windows-arm64
          - all

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            target: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows
            arch: x86_64
            target: windows-x86_64
            runner: ubuntu-24.04
          - platform: windows
            arch: arm64
            target: windows-arm64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.target == 'all' || inputs.target == matrix.target
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.platform == 'windows'
        with:
          path: |
            winbuild-out
            src_packages
            clang-root
          key: mpv-${{ matrix.platform }}-${{ matrix.arch }}-cd1edc11-${{ github.run_id }}
          restore-keys: |
            mpv-${{ matrix.platform }}-${{ matrix.arch }}-cd1edc11-
      - name: Build Linux runtime
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.platform == 'linux'
        run: scripts/build_mpv_linux.sh "${{ matrix.arch }}"
      - name: Build Windows runtime
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.platform == 'windows'
        env:
          PLAYQUICK_MPV_JOBS: "4"
        run: scripts/build_mpv_windows.sh "${{ matrix.arch }}"
      - name: Smoke test native Linux executable
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.platform == 'linux'
        run: "dist/mpv-linux-${{ matrix.arch }}/mpv --version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.target == 'all' || inputs.target == matrix.target
        with:
          name: mpv-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/mpv-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ always() && (inputs.target == 'all' || inputs.target == matrix.target) && matrix.platform == 'windows' }}
        with:
          path: |
            winbuild-out
            src_packages
            clang-root
          key: mpv-${{ matrix.platform }}-${{ matrix.arch }}-cd1edc11-${{ github.run_id }}
